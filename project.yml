name: Cam
options:
  bundleIdPrefix: com.oscarheimdahl
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    # Change this one line to the paid team's ID once enrollment completes.
    TEAM_ID: M59HFVCZCK
    DEVELOPMENT_TEAM: $(TEAM_ID)
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.3"
    # Signing for a CI release (scripts/release.sh): it passes CAM_SIGN_STYLE=Manual and the two Developer ID profile names.
    CAM_SIGN_STYLE: Automatic
    CAM_SIGN_IDENTITY: Apple Development
    APP_PROFILE: ""
    EXT_PROFILE: ""
    CURRENT_PROJECT_VERSION: "1"   # overridden per build (see below): macOS only replaces an extension with a higher version
packages:
  Vortex:
    url: https://github.com/twostraws/Vortex
    exactVersion: 1.0.5   # MIT licensed particle effects, pinned so builds are reproducible
targets:
  Cam:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Cam.icon/**", "InfoDev.plist", "CamDev.entitlements"]     # the icon is added below as one file, not as a folder of SVGs
      - path: Shared
      - path: App/Cam.icon
        buildPhase: resources
      - path: THIRD_PARTY_LICENSES.md
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Cam
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSUIElement: true
        NSCameraUsageDescription: Cam composites stickers onto your camera feed.
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.video
        NSHumanReadableCopyright: Copyright © 2026 oscarheimdahl2. Released under the MIT License.
        CFBundleIconName: Cam
    entitlements:
      path: App/Cam.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.camera: true
        com.apple.developer.system-extension.install: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oscarheimdahl.cam
        CODE_SIGN_STYLE: $(CAM_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(CAM_SIGN_IDENTITY)
        PROVISIONING_PROFILE_SPECIFIER: $(APP_PROFILE)
        ASSETCATALOG_COMPILER_APPICON_NAME: Cam
        ENABLE_HARDENED_RUNTIME: true
    dependencies:
      - package: Vortex
      - target: CamExtension
        embed: true
        codeSign: true
        copy:
          destination: plugins
          subpath: ../Library/SystemExtensions
  CamDev:
    # Editor + live preview only. No virtual camera, so it signs with a free personal team.
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["Cam.icon/**", "Info.plist", "Cam.entitlements"]     # the icon is added below as one file, not as a folder of SVGs
      - path: Shared
      - path: App/Cam.icon
        buildPhase: resources
      - path: THIRD_PARTY_LICENSES.md
        buildPhase: resources
    info:
      path: App/InfoDev.plist
      properties:
        CFBundleName: Cam Dev
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        LSUIElement: true
        NSCameraUsageDescription: Cam composites stickers onto your camera feed.
        LSMinimumSystemVersion: "14.0"
        LSApplicationCategoryType: public.app-category.video
        NSHumanReadableCopyright: Copyright © 2026 oscarheimdahl2. Released under the MIT License.
        CFBundleIconName: Cam
    entitlements:
      path: App/CamDev.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.camera: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oscarheimdahl.cam.dev
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEV_BUILD"   # lets the code label itself as the dev build
        ASSETCATALOG_COMPILER_APPICON_NAME: Cam
        PRODUCT_NAME: CamDev
        ENABLE_HARDENED_RUNTIME: true
    dependencies:
      - package: Vortex
  CamExtension:
    type: system-extension
    platform: macOS
    sources: [Extension, Shared/SharedConstants.swift]
    info:
      path: Extension/Info.plist
      properties:
        CFBundleName: Cam Camera Extension
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleDisplayName: Cam Camera Extension
        CFBundlePackageType: SYSX   # without this macOS does not recognise the bundle as a system extension
        CMIOExtension:
          CMIOExtensionMachServiceName: $(TEAM_ID).com.oscarheimdahl.cam.extension
        NSSystemExtensionUsageDescription: Provides the Cam virtual camera.
    entitlements:
      path: Extension/CamExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups: [$(TEAM_ID).com.oscarheimdahl.cam]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oscarheimdahl.cam.extension
        CODE_SIGN_STYLE: $(CAM_SIGN_STYLE)
        CODE_SIGN_IDENTITY: $(CAM_SIGN_IDENTITY)
        PROVISIONING_PROFILE_SPECIFIER: $(EXT_PROFILE)
        PRODUCT_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)   # system extensions must be named after their bundle identifier
        ENABLE_HARDENED_RUNTIME: true
  CamTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - App/Model/Scene.swift
      - App/Model/Layer.swift
      - App/Model/LegacySticker.swift
      - App/Model/Face.swift
      - App/Model/ConfigStore.swift
      - Extension/PlaceholderCard.swift
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oscarheimdahl.cam.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
schemes:
  Cam:
    build:
      targets:
        Cam: all
  CamDev:
    build:
      targets:
        CamDev: all
  CamTests:
    build:
      targets:
        CamTests: all
    test:
      targets:
        - CamTests
