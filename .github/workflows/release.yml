name: Release

# Push a tag like v0.2.0 (after bumping MARKETING_VERSION in project.yml) and this builds, signs, notarizes and
# publishes the DMG as a GitHub release. "Run workflow" does a dry run: it builds and signs but skips notarization
# and publishing, and keeps the DMG as a workflow artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches project.yml
        if: github.event_name == 'push'
        run: |
          VERSION=$(sed -n 's/^ *MARKETING_VERSION: *"\{0,1\}\([0-9.]*\)"\{0,1\}.*/\1/p' project.yml | head -1)
          TAG="${GITHUB_REF_NAME#v}"
          if [[ "$TAG" != "$VERSION" && "$TAG" != "$VERSION.0" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match MARKETING_VERSION $VERSION in project.yml"
            exit 1
          fi

      - name: Install tools
        run: brew install xcodegen

      - name: Import the Developer ID certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

      - name: Install the Developer ID provisioning profiles
        env:
          PROFILE_APP: ${{ secrets.PROFILE_APP }}
          PROFILE_EXT: ${{ secrets.PROFILE_EXT }}
        run: |
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DIR"
          install_profile() {   # $1 = base64 profile, $2 = env var to set to the profile's name
            echo "$1" | base64 --decode > "$RUNNER_TEMP/p.provisionprofile"
            security cms -D -i "$RUNNER_TEMP/p.provisionprofile" > "$RUNNER_TEMP/p.plist"
            UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/p.plist")
            NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/p.plist")
            cp "$RUNNER_TEMP/p.provisionprofile" "$DIR/$UUID.provisionprofile"
            echo "$2=$NAME" >> "$GITHUB_ENV"
            echo "Installed profile: $NAME"
          }
          install_profile "$PROFILE_APP" APP_PROFILE_NAME
          install_profile "$PROFILE_EXT" EXT_PROFILE_NAME

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize and package
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [[ "$DRY_RUN" == "true" ]]; then scripts/release.sh --skip-notarize; else scripts/release.sh; fi

      - name: Keep the DMG (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Cam-dmg
          path: build/release/*/Cam-*.dmg

      - name: Publish the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DMG=$(ls build/release/*/Cam-*.dmg)
          SHA=$(shasum -a 256 "$DMG" | awk '{print $1}')
          FLAGS=()
          [[ "$GITHUB_REF_NAME" == v0.* ]] && FLAGS+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" "$DMG" "${FLAGS[@]}" \
            --title "Cam ${GITHUB_REF_NAME#v}" --generate-notes \
            --notes "SHA-256 of \`$(basename "$DMG")\`: \`$SHA\`"

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" || true
